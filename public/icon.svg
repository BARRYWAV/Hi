<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <g filter="url(#glow)" transform="translate(64, 64)">
    <!-- Interlocking rings symbol for synchronization -->
    <circle cx="140" cy="192" r="96" fill="none" stroke="url(#ring1)" stroke-width="28" stroke-linecap="round" />
    <circle cx="244" cy="192" r="96" fill="none" stroke="url(#ring2)" stroke-width="28" stroke-linecap="round" stroke-dasharray="450 150" />
    <circle cx="140" cy="192" r="24" fill="#A855F7" />
    <circle cx="244" cy="192" r="24" fill="#06B6D4" />
  </g>
</svg>
